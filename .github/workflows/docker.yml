name: "Docker"

on:
  workflow_dispatch:

  push:

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/tika:latest-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test image
        run: make test DOCKER_TAG=latest-test

      - name: Smoke test image
        run: make test-docker DOCKER_TAG=latest-test

  version:
    name: "Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tika: ${{ steps.version.outputs.TIKA_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: cat VERSION >> "$GITHUB_OUTPUT"

  build:
    name: "Build"
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        tag:
          - "latest"
          - "${{ needs.version.outputs.version }}"
          - "${{ needs.version.outputs.tika }}"
          - "${{ needs.version.outputs.tika }}-${{ needs.version.outputs.version }}"
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/tika"
      tag: ${{ matrix.tag }}
      context: "."
      platforms: "linux/amd64,linux/arm64"
      push: ${{ github.ref == 'refs/heads/master' }}

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./VERSION
          gh release view "$VERSION" || gh release create "$VERSION" --generate-notes

  docs:
    name: "Docs"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/tika
