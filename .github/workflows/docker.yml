name: "Docker"

on:
  workflow_dispatch:

  push:

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/tika:latest-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test image
        run: make test DOCKER_TAG=latest-test

      - name: Smoke test image
        run: make test-docker DOCKER_TAG=latest-test

  build:
    name: "Build (${{ matrix.tag }})"
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["3.3.1.0", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # latest is also tagged <VERSION>, other tags <tag>-<VERSION>
      - name: Read VERSION
        id: version
        env:
          TAG: ${{ matrix.tag }}
        run: |
          v="$(cat VERSION)"
          grep -Eqx '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' <<<"$v" || { echo "::error file=VERSION::expected YYYY.MM.DD or YYYY.MM.DD.N, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = latest ]; then echo "tag=$v"; else echo "tag=$TAG-$v"; fi >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "."
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            dockette/tika:${{ matrix.tag }}
            dockette/tika:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          platforms: "linux/amd64,linux/arm64"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the commit and publishes a GitHub release for VERSION the first
  # time it reaches master with the images pushed (make release bumps it).
  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists"
            exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes

  docs:
    name: "Docs"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/tika
